global:
  scrape_interval: 10s
  evaluation_interval: 10s
  scrape_timeout: 8s
  external_labels:
    monitor: 'devops-academy-monitor'

rule_files:
  - "/etc/prometheus/rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

scrape_configs:
  # Scrape DevOps Academy Node.js Backend API
  - job_name: 'devops-academy-backend'
    metrics_path: '/api/metrics'
    scheme: 'http'
    static_configs:
      - targets: ['backend:5000']
        labels:
          application: 'devops-academy'
          environment: 'production'

  # Scrape Prometheus instance itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          application: 'prometheus'
 
  # Scrape Node Exporter system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          application: 'ubuntu-system'
          environment: 'development'
