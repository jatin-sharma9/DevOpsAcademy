name: DevOps Academy Full CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/**'
      - 'docker-compose*.yml'
  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/**'
      - 'docker-compose*.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Job 1: Backend Validation & Unit/Integration Tests ──────────────────
  backend-ci:
    name: 1. Backend Validation & Full Test Matrix
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_test_password
          POSTGRES_DB: devops_academy_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    env:
      PORT: 5000
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: devops_academy_ci
      DB_USER: postgres
      DB_PASSWORD: postgres_ci_test_password
      JWT_SECRET: devops_academy_ci_test_jwt_secret_key_32chars_long!
      JWT_EXPIRES_IN: 7d

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci

      - name: Validate Backend Environment Variables
        run: npm run env:validate
        env:
          PORT: 5000
          NODE_ENV: test
          DB_HOST: localhost
          JWT_SECRET: devops_academy_ci_test_jwt_secret_key_32chars_long!

      - name: Run Dependency Audit
        run: npm run security:audit

      - name: Execute Automated PostgreSQL Schema Migration
        run: npm run db:migrate

      - name: Verify Schema Migration Status
        run: npm run db:migrate:status

      - name: Seed Platform Initial Data
        run: npm run db:seed

      - name: Run Complete Backend Test Suite Matrix (All 8 Suites)
        run: npm run test:all

  # ─── Job 2: Frontend Typecheck & Production Build ────────────────────────
  frontend-ci:
    name: 2. Frontend Typecheck & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run TypeScript Strict Typecheck
        run: npm run typecheck

      - name: Run Production Bundle Build
        run: npm run build

  # ─── Job 3: Security & Vulnerability Scanning ────────────────────────────
  security-scan:
    name: 3. Security & Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Scan Codebase with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # ─── Job 4: Docker Container Builds & Healthcheck Verification ───────────
  docker-build-and-verify:
    name: 4. Docker Builds & Healthcheck Verification
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_test_password
          POSTGRES_DB: devops_academy_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: devops-academy-backend:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Production Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: devops-academy-frontend:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Backend Container & Verify Health Probes
        run: |
          docker run -d \
            --name backend-ci-container \
            --network host \
            -e PORT=5001 \
            -e NODE_ENV=production \
            -e DB_HOST=localhost \
            -e DB_PORT=5432 \
            -e DB_NAME=devops_academy_ci \
            -e DB_USER=postgres \
            -e DB_PASSWORD=postgres_ci_test_password \
            -e JWT_SECRET=production_ci_test_secret_key_32characters_minimum! \
            devops-academy-backend:ci

          echo "Waiting for container startup and database connection..."
          sleep 6

          echo "Testing Liveness Probe (GET /api/health/live)..."
          curl -f http://localhost:5001/api/health/live || (docker logs backend-ci-container && exit 1)

          echo "Testing Readiness Probe (GET /api/health/ready)..."
          curl -f http://localhost:5001/api/health/ready || (docker logs backend-ci-container && exit 1)

          echo "Testing Prometheus Metrics (GET /api/metrics)..."
          curl -f http://localhost:5001/api/metrics | grep "http_requests_total" || (docker logs backend-ci-container && exit 1)

          docker stop backend-ci-container
          docker rm backend-ci-container

      - name: Run Frontend Container & Verify Nginx Health
        run: |
          docker run -d \
            --name frontend-ci-container \
            -p 8090:80 \
            devops-academy-frontend:ci

          sleep 3
          echo "Testing Frontend Nginx Health (GET /healthz)..."
          curl -f http://localhost:8090/healthz || (docker logs frontend-ci-container && exit 1)

          echo "Testing Frontend SPA Routing (/courses/linux-fundamentals)..."
          curl -f http://localhost:8090/courses/linux-fundamentals || (docker logs frontend-ci-container && exit 1)

          docker stop frontend-ci-container
          docker rm frontend-ci-container
          echo "✅ All Container Probes Verified Successfully!"
