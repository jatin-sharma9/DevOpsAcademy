services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: devops_academy_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-devops_academy}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-devops_academy}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devops_network

  # Node.js Express Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devops_academy_backend
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      PORT: 5000
      NODE_ENV: ${NODE_ENV:-development}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5200}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-devops_academy}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-devops_academy_super_secret_jwt_key_2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      SMTP_SERVICE: ${SMTP_SERVICE:-gmail}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-"DevOps Academy" <noreply@devopsacademy.com>}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-jatinsharma932002@gmail.com}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-Jatin_Sharma}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-jatinsharma932002@gmail.com}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-J@tinS93}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - devops_network

  # Nginx Frontend Web Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devops_academy_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5200}:80"
    depends_on:
      - backend
    networks:
      - devops_network

  # Prometheus Metrics Collector
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: devops_academy_prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9095}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - backend
    networks:
      - devops_network


  # Alertmanager for Prometheus notifications
  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: devops_academy_alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    networks:
      - devops_network


  # Grafana Dashboard & Visualizations
  grafana:
    image: grafana/grafana:10.2.2
    container_name: devops_academy_grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - devops_network

volumes:
  pgdata:
    driver: local
  backend_uploads:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  devops_network:
    driver: bridge
