# ==============================================================================
# DevOps Academy - Production Docker Compose Orchestration
# ==============================================================================
# Architecture:
# - Multi-tier network isolation (backend_net, frontend_net, monitoring_net)
# - Automated migration runner before backend initialization
# - Resource limits (CPU/Memory) & hardened logging rotation
# - Healthcheck dependencies ensuring zero-downtime ordered startup
# ==============================================================================

services:
  # ─── 1. PostgreSQL Database ────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: devops_academy_prod_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be provided for production}
      POSTGRES_DB: ${DB_NAME:-devops_academy}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-devops_academy}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - backend_net

  # ─── 2. Database Migration Runner (Init Container) ─────────────────────────
  migration:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devops_academy_prod_migration
    restart: "no"
    command: ["node", "src/config/migrate.js"]
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-devops_academy}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend_net

  # ─── 3. Node.js Backend API Service ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devops_academy_prod_backend
    restart: always
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-devops_academy}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      SMTP_SERVICE: ${SMTP_SERVICE:-gmail}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-"DevOps Academy" <noreply@devopsacademy.com>}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-jatinsharma932002@gmail.com}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-Jatin_Sharma}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-jatinsharma932002@gmail.com}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-J@tinS93}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - backend_uploads_prod:/app/uploads
      - backend_logs_prod:/app/logs
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - backend_net
      - frontend_net
      - monitoring_net

  # ─── 4. Nginx Frontend SPA Web Server ──────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: devops_academy_prod_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - frontend_net

  # ─── 5. Prometheus Observability (Profile: monitoring) ─────────────────────
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: devops_academy_prod_prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9095}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data_prod:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    depends_on:
      - backend
    profiles: ["monitoring", "full"]
    networks:
      - monitoring_net

  # ─── 6. Grafana Analytics Dashboards (Profile: monitoring) ─────────────────
  grafana:
    image: grafana/grafana:10.2.2
    container_name: devops_academy_prod_grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data_prod:/var/lib/grafana
    depends_on:
      - prometheus
    profiles: ["monitoring", "full"]
    networks:
      - monitoring_net

volumes:
  pgdata_prod:
    driver: local
  backend_uploads_prod:
    driver: local
  backend_logs_prod:
    driver: local
  prometheus_data_prod:
    driver: local
  grafana_data_prod:
    driver: local

networks:
  backend_net:
    driver: bridge
  frontend_net:
    driver: bridge
  monitoring_net:
    driver: bridge
